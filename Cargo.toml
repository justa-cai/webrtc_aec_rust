[package]
name = "webrtc-aec-rust"
version = "0.1.0"
edition = "2021"
description = "WebRTC AEC3 线性 AEC + 时延估计的 Rust 参考实现（不含非线性抑制器）"
license = "BSD-3-Clause"

[dependencies]
rustfft = "6"
hound = "3.5"

[lib]
name = "webrtc_aec_rust"
path = "src/lib.rs"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[profile.release]
opt-level = 3
