      - paragraph [ref=e149]: 取舍与局限：本模型在官方示例对上比参考实现少消约 3.3 dB 回声，换来近端损伤减半（上表第二行）——门控把参考安静的频点原样透传，是结构性质而非训练出来的。合成线性回声路径（已知干净近端的测试集）上它弱于带减法级的方案，这是「掩码直接乘麦克风」这一类的固有代价。详见仓库 README。
    - generic [ref=e150]:
      - heading "05 怎么做的" [level=2] [ref=e151]:
        - generic [ref=e152]: "05"
        - text: 怎么做的
      - img "信号流。远端参考 x(n) 沿顶部依次经过四级：GCC-PHAT 延迟估计（输出标量延迟 tau）、 参考 x(n) 与麦克风 d(n) 先经过一个共享的逐频点白化权重，再做 16 频带特征；GRU 在这些带上预测 257 点掩码，直接乘到麦克风频谱上。同时 GCC-PHAT 对麦克风与参考做互相关，先捕获整体时延，逐帧跟踪器随后跟随，把参考对齐到回声位置。输出 e(n) = mask · d(n)，经逐频点合成权重整形后重叠相加回波形。" [ref=e154]
      - list [ref=e155]:
        - listitem [ref=e156]: 延迟估计，两半。GCC-PHAT 互相关经可微 soft-argmax 得到标量延迟（曲线很平，先标准化再做 softmax，否则 soft-argmax 会塌到零）。它只跑一次——开头 1 秒，负责在 ±1 s 全范围内捕获时延（搜索范围 ±10240 样点 = 0.64 s，捕获需要这一秒的余量）。之后是经典、零参数的逐帧跟踪：每 10 ms 对尾随 1 秒做 GCC-PHAT，在当前估计 ±100 样点的带内取最优滞后，泄漏式走 25%——带内的跳变几帧内跟上，整数 argmax 的 ±1 样点抖动到不了对齐。带内而不是同一相关的全局峰，是刻意选择：全局搜索看得见所有竞争者，而最响的不一定是回声——官方示例对上，一个弱但相干的近零滞后远端串音在 PHAT 归一掉电平差之后压过真实的混响峰，全局峰版本锁定在滞后 2 上长达 5 秒，同样权重下 ERLE 4.4 dB 对本跟踪器 7.7 dB。置信门分不开两个相干峰，带内可以——结构性地，它根本不看滞后 2，因为捕获（有监督训练）把它放到了真实路径上。代价明说：单步超过 ±100 样点的路径跳变要重新捕获才能跟上；流式调用开头缓存 1 秒才产出第一个样点（该缓存就是捕获窗），之后唯一延迟是前端固有的 352 样点——实测增长前缀在 1 秒之后与整段离线结果逐样点误差小于 1e-6。
        - listitem [ref=e157]: 白化。一个学出来的逐频点权重，麦克风和参考共用，把远端的频谱倾斜从特征里归一掉。掩码网络于是只需要学「有多少回声」，不用学「远端是什么颜色」。
        - listitem [ref=e158]:
          - text: 掩码，直接乘麦克风。GRU 在白化后的 16 频带能量（麦克风、对齐参考、二者乘积——其中麦克风那一路进了两次，训练时如此，权重按原样保留）上预测 257 点增益，输出就是
          - code [ref=e159]: e(n) = mask · d(n)
          - text: 。参考信号不给输出贡献任何能量——它只引导掩码。两条性质因此是结构性的而非训练出来的：麦克风静音则输出精确为零；参考没能量的频点掩码被强制为 1，近端原样通过，无论权重是什么。
        - listitem [ref=e160]:
          - text: 远端门。对齐参考某个频点没有能量，那里就没有东西可压，掩码向 1 混合（
          - code [ref=e161]: 1 + act·(mask−1)
          - text: ）。这是模型行为上最大的旋钮：开小些压得更多、近端伤得更多，是推理期参数，记录在 checkpoint 里。
        - listitem [ref=e162]:
          - text: 合成。一个恒等初始化的逐频点权重整形掩码后的频谱，显式重叠相加还原波形。开头
          - code [ref=e163]: NFFT−HOP
          - text: 个样点交叉淡入回麦克风：重叠相加的归一化因子在第 1 个样点处比稳态小四个数量级，否则任何谱修改都会在那里放大成一声爆音。
      - paragraph [ref=e164]: 两个网络分阶段训练：先只训延迟估计器（用合成路径的精确时延标签），冻结后再训掩码网络。共享输出梯度会让两个目标把时延往相反方向拉。
